services:
  app:
    container_name: ecom-panel-app
    build:
      context: .
      dockerfile: Dockerfile
    image: ecom-panel-app:dev
    restart: unless-stopped
    ports:
      - "8002:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    container_name: ecom-panel-db
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: laravel
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - dbdata:/var/lib/mysql

  adminer:
    container_name: ecom-panel-adminer
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8083:8080"
    depends_on:
      - db

  frontend:
    container_name: ecom-storefront
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8002/api/v1
    depends_on:
      - app

volumes:
  dbdata:
    driver: local

